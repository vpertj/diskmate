[package]
name = "diskmate"
version = "0.1.0"
description = "DiskMate - Professional Mac Disk Cleaner"
authors = ["DiskMate"]
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "diskmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 磁盘清理核心依赖
walkdir = "2.5"
sha2 = "0.10"
trash = "5.1"
sysinfo = "0.31"
tokio = { version = "1", features = ["full"] }
dirs = "5"
log = "0.4"
chrono = "0.4"

[features]
# 默认特性
default = []
